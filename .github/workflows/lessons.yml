name: Paper lessons

# Backup for the snapshot chain. The chain runs this same script once per UTC
# day. This cron is only there if that chain stops. Minute 15 avoids the
# top-of-hour schedule pileup. This job does not edit strategy thresholds.
on:
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lessons:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node runner/learn-nightly.mjs
      - name: Commit lessons when they changed
        env:
          SNAP_GIT_NAME: paper-lessons
          SNAP_GIT_EMAIL: paper-lessons@users.noreply.github.com
        run: bash runner/push-with-retry.sh "Update the paper lessons" data/lessons.json data/brain.json LESSONS.md

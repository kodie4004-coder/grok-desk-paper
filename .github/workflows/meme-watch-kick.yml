name: Meme stop watcher kick

# Backup for meme-watch.yml. The Kalshi chain dispatches a pass directly,
# about every four minutes, while a paper coin is open. This cron is the
# spare. On 2026-11-20 GitHub fired zero of these events in 70 minutes, so
# the cron is not the thing the stops depend on. Public repo, one short job.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: meme-stop-kick
  cancel-in-progress: false

jobs:
  kick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Start a pass when none is running
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${GITHUB_REPOSITORY:?}"
          raw="$(gh run list --workflow meme-watch.yml --repo "$repo" --limit 20 --json databaseId,status)"
          choice="$(printf '%s' "$raw" | node runner/queue-next.mjs 0)"
          echo "decision=$choice"
          if [ "$choice" = "dispatch" ]; then
            gh workflow run meme-watch.yml --ref main --repo "$repo"
          else
            echo "watch chain is already active"
          fi

name: Kalshi snapshot chain kick

# Backstop for kalshi-15m.yml. The schedule on that workflow is not a restart:
# GitHub dropped it for hours on 2026-11-18 and again after 02:09Z on 2026-11-19.
# This runs when a snapshot workflow finishes. If that run already queued the
# next one, this exits. If it did not, this dispatches one and fails when the
# dispatch does not stick.
on:
  workflow_run:
    workflows: ["Kalshi 15-minute snapshot"]
    types: [completed]

permissions:
  contents: read
  actions: write

jobs:
  kick:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restart the chain when nothing is active
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ "$PREVIOUS" = "failure" ]; then
            bash runner/queue-snapshot.sh --backoff
          else
            sleep 20
            bash runner/queue-snapshot.sh
          fi

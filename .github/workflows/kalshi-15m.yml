name: Kalshi 15-minute snapshot

# GitHub's scheduler dropped every */5 run of this workflow: from the merge at
# 04:50Z until 12:40Z there was one workflow_dispatch and zero schedule events.
# The job-level ref guard was not the cause. A skipped job would still be a run.
# Docs say schedules are delayed at the top of each hour and queued jobs can be
# dropped: https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule
#
# The reliable path is workflow_dispatch. GITHUB_TOKEN cannot start a push
# workflow, but it can start workflow_dispatch:
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow
# Each successful pass waits three minutes and queues the next pass.
#
# Run 44441797302 (2026-11-19T02:09:20Z) logged queued=0 in_progress=0 while
# the step was still running. The old guard required in_progress==1, treated
# that miss as "someone else is running", and exited 0. The chain stopped.
# runner/queue-next.mjs dispatches whenever no OTHER run is queued or running,
# and runner/queue-snapshot.sh fails the job if the dispatch does not stick.
# kalshi-15m-kick.yml starts a run when this one finished and nothing else is
# active, and its 10-minute schedule starts one when the newest snapshot is
# older than 10 minutes. The cron below is only a last resort. GitHub still
# drops most of those events.
#
# Run 44676854746 (2026-11-20T04:48:34Z) committed a snapshot and git push was
# rejected: main had moved under it (fetch first / not a fast-forward). The
# queue step was `if: success()`, so the rejection ended the chain. The push
# now fetches, rebases, and retries. The queue step is `if: always()`.
#
# Meme stops are not on a schedule. GitHub never fired the 5-minute kick
# after that workflow merged. This chain already wakes itself about every
# four minutes, so it dispatches meme-watch.yml with gh workflow run when a
# paper coin is open. A GITHUB_TOKEN run does not emit workflow_run, so the
# watch workflow must not listen for this job. The meme snapshot runner
# dispatches the same way. The 5-minute kick stays as a backup.
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/kalshi-15m.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: kalshi-15m-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node runner/snapshot-kalshi.mjs
      - run: node runner/journal-step.mjs
      - run: node runner/daily-jobs.mjs
      - name: Snapshot meme coins and start a stop pass when one is open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node runner/snapshot-meme.mjs || echo 'meme snapshot skipped'
      - name: Commit the snapshot when it changed
        run: bash runner/push-snapshot.sh
      - name: Dispatch a meme stop pass when a paper coin is open
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash runner/kick-watch.sh || echo 'meme watch dispatch did not stick; the next snapshot will try again'
      - name: Queue the next refresh
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            sleep 180
            bash runner/queue-snapshot.sh
          else
            bash runner/queue-snapshot.sh --backoff
          fi

name: Kalshi 15-minute snapshot

# GitHub's scheduler dropped every */5 run of this workflow: from the merge at
# 04:50Z until 12:40Z there was one workflow_dispatch and zero schedule events.
# The job-level ref guard was not the cause. A skipped job would still be a run.
# Docs say schedules are delayed at the top of each hour and queued jobs can be
# dropped: https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule
#
# The reliable path is workflow_dispatch. GITHUB_TOKEN cannot start a push
# workflow, but it can start workflow_dispatch:
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow
# Each successful pass waits three minutes and queues the next pass.
#
# Run 44441797302 (2026-11-19T02:09:20Z) logged queued=0 in_progress=0 while
# the step was still running. The old guard required in_progress==1, treated
# that miss as "someone else is running", and exited 0. The chain stopped.
# runner/queue-next.mjs dispatches whenever no OTHER run is queued or running,
# and runner/queue-snapshot.sh fails the job if the dispatch does not stick.
# kalshi-15m-kick.yml starts a run when this one finished and nothing else is
# active, so a missed dispatch does not wait on the cron below. The cron is
# only a last resort. GitHub still drops most of those events.
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/kalshi-15m.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: kalshi-15m-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node runner/snapshot-kalshi.mjs
      - run: node runner/journal-step.mjs
      - run: node runner/daily-jobs.mjs
      - run: node runner/snapshot-meme.mjs || echo 'meme snapshot skipped'
      - name: Commit the snapshot when it changed
        run: |
          git config user.name "kalshi-snapshot"
          git config user.email "kalshi-snapshot@users.noreply.github.com"
          git add data/kalshi-15m.json data/journal.jsonl data/journal-open.json data/journal-quotes.json data/lessons.json data/brain.json data/filings.json LESSONS.md
          [ -f data/morning.json ] && git add data/morning.json
          [ -f data/heartbeat.json ] && git add data/heartbeat.json
          [ -f data/meme-board.json ] && git add data/meme-board.json data/meme-open.json data/meme-journal.jsonl
          if git diff --cached --quiet; then
            echo "snapshot unchanged"
          else
            git commit -m "Update the Kalshi paper snapshot and journal"
            git push
          fi
      - name: Queue the next refresh
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 180
          bash runner/queue-snapshot.sh

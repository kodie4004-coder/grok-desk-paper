name: Kalshi 15-minute snapshot

# The public API allows only https://kalshi.com as a browser Origin.
# This job refreshes the same-origin file the desk reads. Schedule runs on main.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node runner/snapshot-kalshi.mjs
      - name: Commit the snapshot when it changed
        run: |
          git config user.name "kalshi-snapshot"
          git config user.email "kalshi-snapshot@users.noreply.github.com"
          git add data/kalshi-15m.json
          git diff --cached --quiet && exit 0
          git commit -m "Update the Kalshi 15-minute paper snapshot"
          git push

name: Filings snapshot

# EDGAR requires a descriptive User-Agent. The browser does not send one we control,
# so this job writes data/filings.json. 13Fs change quarterly, so once a day is enough.
on:
  schedule:
    - cron: '20 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node runner/collect-filings.mjs
      - name: Commit the filings snapshot when it changed
        env:
          SNAP_GIT_NAME: filings-snapshot
          SNAP_GIT_EMAIL: filings-snapshot@users.noreply.github.com
        run: bash runner/push-with-retry.sh "Update the public filings snapshot" data/filings.json

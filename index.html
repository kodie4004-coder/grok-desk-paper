<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090c">
<meta name="description" content="Paper-only market desk. Signals are not advice. No wallet and no orders.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Grok Desk · Paper</title>
<link rel="manifest" href="manifest.json">
<!-- Artwork slots. The next art PR drops icons/app-icon.png and icons/splash.png,
     then points #app-icon-slot, #splash-slot, and manifest.json icons[] at them.
     These links stay on the current mark so nothing 404s until that art lands. -->
<link id="app-icon-slot" rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link id="splash-slot" rel="apple-touch-startup-image" href="icons/icon-512.png">
<meta name="apple-mobile-web-app-title" content="Grok Desk">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-link" href="#view">Skip to content</a>
<header class="top">
  <h1 class="brand">Grok Desk</h1>
  <div id="modeBadge" class="badge paper">PAPER MODE · fake money</div>
</header>
<div id="replayBanner" class="replay hidden"></div>
<p id="linkState" class="link" hidden></p>
<div id="ticker" class="ticker" hidden><div class="ticker-track" id="tickerTrack"></div></div>
<main id="view" tabindex="-1"></main>
<div id="toasts" aria-live="polite"></div>
<div id="fx" class="fx" aria-hidden="true"></div>
<nav class="tabs" aria-label="Primary">
  <button data-tab="home" class="on"><span>◉</span>Home</button>
  <button data-tab="arena"><span>▶</span>Arena</button>
  <button data-tab="coins"><span>◎</span>Coins</button>
  <button data-tab="score"><span>★</span>Score</button>
  <button data-tab="brain"><span>✦</span>Brain</button>
  <button data-tab="predict"><span>◎</span>Predict</button>
  <button data-tab="settings"><span>⚙</span>Set</button>
</nav>
<script type="module" src="app.js?v=16"></script>
</body>
</html>
